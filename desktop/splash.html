<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* ------------------------------------------------------------------ */
    /* v2 palette — light defaults, dark via prefers-color-scheme or an    */
    /* explicit ?theme=dark|light query param (Electron transparent card). */
    /* ------------------------------------------------------------------ */
    :root {
      --splash-bg: #ffffff;
      --splash-well: #f4f4f5;
      --splash-text: #1a1a1a;
      --splash-text-secondary: #5a5a66;
      --splash-text-tertiary: #8b8b93;
      --splash-green: #16a34a;
      --splash-border: rgba(0, 0, 0, 0.12);
      --splash-track: rgba(0, 0, 0, 0.08);
      --splash-ring-track: rgba(22, 163, 74, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --splash-bg: #131417;
        --splash-well: #0b0c0e;
        --splash-text: #ececec;
        --splash-text-secondary: #a3a3a3;
        --splash-text-tertiary: #8b8b8b;
        --splash-green: #4ade80;
        --splash-border: #232428;
        --splash-track: rgba(255, 255, 255, 0.08);
        --splash-ring-track: rgba(74, 222, 128, 0.18);
      }
    }

    html[data-theme='dark'] {
      --splash-bg: #131417;
      --splash-well: #0b0c0e;
      --splash-text: #ececec;
      --splash-text-secondary: #a3a3a3;
      --splash-text-tertiary: #8b8b8b;
      --splash-green: #4ade80;
      --splash-border: #232428;
      --splash-track: rgba(255, 255, 255, 0.08);
      --splash-ring-track: rgba(74, 222, 128, 0.18);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background: transparent;
      color: var(--splash-text-secondary);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: flex;
      padding: 12px;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    /* Opaque branded card — the window itself is transparent */
    .splash-card {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--splash-bg);
      border: 1px solid var(--splash-border);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .splash-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 24px 12px;
    }

    /* Wordmark — normal Inter casing, quiet two-tone accent */
    .wordmark {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.01em;
      color: var(--splash-text);
      margin-bottom: 22px;
    }

    .wordmark .accent {
      color: var(--splash-green);
    }

    /* Quiet two-ring mark on a soft well disc */
    .mark {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .mark::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--splash-well);
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--splash-ring-track);
    }

    .ring1 {
      width: 56px;
      height: 56px;
      border-top-color: var(--splash-green);
      animation: spin 2.4s linear infinite;
    }

    .ring2 {
      width: 38px;
      height: 38px;
      border-bottom-color: var(--splash-text-secondary);
      animation: spin-reverse 3.2s linear infinite;
    }

    .dot {
      position: relative;
      width: 8px;
      height: 8px;
      background-color: var(--splash-green);
      border-radius: 50%;
      animation: pulse-dot 2.4s ease-in-out infinite alternate;
    }

    /* Bottom section — progress + status + version */
    .bottom {
      width: 100%;
      padding: 0 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.5s ease-out 0.2s both;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: var(--splash-track);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--splash-green), transparent);
      border-radius: 999px;
      animation: progress 2.2s ease-in-out infinite;
    }

    .progress-bar.determinate {
      width: 0%;
      background: var(--splash-green);
      animation: none;
      transition: width 0.25s ease;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .status-container {
      height: 18px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .status-text {
      font-size: 12px;
      color: var(--splash-text-secondary);
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 1;
      transform: translateY(0);
    }

    .status-text.fade {
      opacity: 0;
      transform: translateY(-6px);
    }

    .version {
      font-size: 11px;
      color: var(--splash-text-tertiary);
      flex: none;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0%   { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulse-dot {
      0%   { transform: scale(0.85); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes progress {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    /* Reduced motion — static mark, still bar, plain text swap */
    @media (prefers-reduced-motion: reduce) {
      .ring1,
      .ring2,
      .dot,
      .bottom,
      .progress-bar {
        animation: none !important;
      }

      .status-text {
        transition: opacity 0.15s ease;
      }

      .status-text.fade {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-main">
      <div class="wordmark">Cachi<span class="accent">Bot</span></div>

      <div class="mark">
        <div class="ring ring1"></div>
        <div class="ring ring2"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="bottom">
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div class="status-row">
        <div class="status-container">
          <span class="status-text" id="status">Initializing...</span>
        </div>
        <span class="version" id="version"></span>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const version = params.get('version');
    if (version) document.getElementById('version').textContent = 'v' + version;

    // Optional explicit theme: ?theme=dark|light overrides prefers-color-scheme
    const theme = params.get('theme');
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.dataset.theme = theme;
    }

    const statusEl = document.getElementById('status');
    const progressBar = document.querySelector('.progress-bar');

    // Called from main process via executeJavaScript
    window.updateStatus = function(text) {
      // Slide out
      statusEl.classList.add('fade');
      setTimeout(() => {
        statusEl.textContent = text;
        // Reset to below position while invisible
        statusEl.style.transform = 'translateY(6px)';
        // Force reflow so the browser registers the new position
        statusEl.offsetHeight;
        // Clear inline style and remove fade to slide in from below
        statusEl.style.transform = '';
        statusEl.classList.remove('fade');
      }, 300);
    };

    window.showDeterminateProgress = function() {
      progressBar.classList.add('determinate');
      progressBar.style.width = '0%';
    };

    window.showIndeterminateProgress = function() {
      progressBar.classList.remove('determinate');
      progressBar.style.width = '';
    };

    window.updateProgress = function(percent) {
      if (!progressBar.classList.contains('determinate')) {
        progressBar.classList.add('determinate');
      }
      progressBar.style.width = Math.round(percent) + '%';
    };
  </script>
</body>
</html>
