name: Publish Dev Version to PyPI

on:
  push:
    branches: [ dev ]

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-pre-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Fetch tags
        run: |
          git fetch --tags --prune
          git tag --list | sort -V

      - name: Compute next dev version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # latest release tag (no pre-release), e.g. v1.0.1
          last_release="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"

          # Committed VERSION (e.g. 0.4.0) — may carry a .devN suffix; strip it
          file_version="$(tr -d '[:space:]' < VERSION)"
          file_base="${file_version%%.dev*}"

          # Version rule: if the committed VERSION is a valid stable semver
          # strictly greater than the latest release tag, publish pre-releases
          # of THAT version (0.4.0.dev1, 0.4.0.dev2, ...). Per PEP 440,
          # X.Y.Z.devN sorts BEFORE X.Y.Z, so these builds never collide with
          # or exceed the eventual release, and installers always prefer the
          # final release over its dev builds. Once vX.Y.Z is tagged, VERSION
          # is no longer strictly greater, and the base falls back to the next
          # patch: X.Y.(Z+1).devN.
          base=""
          if [[ "${file_base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [[ -n "${last_release}" ]]; then
              last_version="${last_release#v}"
            else
              last_version="0.0.0"
            fi
            highest="$(printf '%s\n%s\n' "${last_version}" "${file_base}" | sort -V | tail -1)"
            if [[ "${file_base}" != "${last_version}" && "${highest}" == "${file_base}" ]]; then
              base="${file_base}"
            fi
          fi
          if [[ -z "${base}" ]]; then
            if [[ -z "${last_release}" ]]; then
              base="0.1.0"  # bootstrap if no tags yet
            else
              v="${last_release#v}"                    # 1.0.0
              IFS=. read -r MA MI PA <<< "${v}"
              PA=$((PA+1))                             # next patch
              base="${MA}.${MI}.${PA}"                 # 1.0.1
            fi
          fi

          # find last dev tag for this base: v1.0.1.dev*
          last_dev="$(git tag -l "v${base}.dev*" | sort -V | tail -1 || true)"
          if [[ -z "${last_dev}" ]]; then
            dev_n=1
          else
            suffix="${last_dev##*.dev}"               # take N from ...devN
            dev_n=$((suffix+1))
          fi

          new="${base}.dev${dev_n}"
          echo "base=${base}" >> $GITHUB_OUTPUT
          echo "new=${new}"   >> $GITHUB_OUTPUT
          echo "tag=v${new}"  >> $GITHUB_OUTPUT
          echo "Computed dev version: ${new}"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push dev tag
        run: |
          git tag -a "${{ steps.ver.outputs.tag }}" -m "pre: ${{ steps.ver.outputs.new }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.x' }

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install setuptools_scm build twine

      - name: Set version in VERSION file
        run: |
          echo "${{ steps.ver.outputs.new }}" > VERSION
          echo "Version: $(cat VERSION)"

      - name: Build (dev)
        run: |
          python -m build -o dist/cachibot

      - name: Publish to PyPI (dev)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m twine upload dist/cachibot/* --non-interactive
