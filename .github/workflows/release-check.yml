name: Release Build Check

# Proves the release build steps from publish.yml work on a PR before merging
# to main. Mirrors the build-cli (3 OS), build-backend + build-server-mini
# (Linux) and build-desktop (Linux) jobs — including their smoke tests and
# CLI archive step — but never creates tags or releases, never uploads
# assets, and never publishes to PyPI (electron-builder runs with
# --publish never).
#
# Manual dispatch with `attach_to_tag` set (e.g. "v0.4.0") additionally
# attaches the built CLI archives to the existing GitHub release for that
# tag and refreshes the asset sizes in its body. It still never creates
# tags or releases and never publishes to PyPI.

on:
  pull_request:
    paths:
      - '*.spec'
      - '.github/workflows/publish.yml'
      - '.github/workflows/release-check.yml'
      - 'desktop/package.json'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      attach_to_tag:
        description: 'Existing release tag to attach CLI archives to (e.g. v0.4.0). Empty = dry run, nothing is uploaded.'
        type: string
        default: ''

concurrency:
  group: release-check-${{ github.ref }}${{ inputs.attach_to_tag }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fixed placeholder version, usable verbatim in both ecosystems: PEP 440
  # parses it (normalizing to 0.0.0.dev1, which hatchling accepts during
  # pip install -e .) and it is valid semver for `npm version`. The backend
  # smoke test only rejects the literal 0.0.0-unknown fallback, so this still
  # exercises the real VERSION-file bundling path without impersonating a
  # release version.
  CHECK_VERSION: '0.0.0-dev1'

jobs:
  # =========================================================================
  # Frontend build, reused by the server jobs via artifact
  # =========================================================================
  frontend-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Attach mode: build the frontend from the tag too, so the CLI
          # archive matches the release it is attached to.
          ref: ${{ inputs.attach_to_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # =========================================================================
  # CLI-only binary (3 platforms) — same steps as publish.yml build-cli,
  # including the archive step. With attach_to_tag set, the archives are
  # additionally uploaded to that existing release.
  # =========================================================================
  build-cli:
    needs: frontend-dist
    permissions:
      # Write is only exercised in attach mode (gh release upload); dry runs
      # on pull_request never reach the upload step.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: cachi-linux-x64.tar.gz
            archive_cmd: tar -czf
          - os: macos-latest
            archive_name: cachi-mac-arm64.tar.gz
            archive_cmd: tar -czf
          - os: windows-latest
            # Git Bash on windows-latest has no zip; 7-Zip is preinstalled
            # and on PATH.
            archive_name: cachi-win-x64.zip
            archive_cmd: 7z a -tzip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Dry run: the event's ref (PR merge commit or dispatched branch).
          # Attach mode: the tag the archives will be uploaded to.
          ref: ${{ inputs.attach_to_tag || github.ref }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CachiBot (core only) + PyInstaller
        shell: bash
        run: |
          # Keep the real VERSION from the checked-out tag in attach mode so
          # the uploaded binary reports the release version.
          if [[ -z "${{ inputs.attach_to_tag }}" ]]; then
            echo "$CHECK_VERSION" > VERSION
          fi
          pip install -e .
          pip install pyinstaller

      - name: Clean __pycache__
        shell: bash
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Build CLI binary
        run: pyinstaller cachibot-cli.spec --clean

      - name: Smoke test CLI binary
        shell: bash
        run: |
          BINARY="./dist/cachi/cachi"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BINARY="./dist/cachi/cachi.exe"
          fi
          "$BINARY" --help
          echo "CLI smoke test passed"

      - name: Archive CLI binary
        shell: bash
        run: |
          cd dist
          ${{ matrix.archive_cmd }} "${{ matrix.archive_name }}" cachi/

      - name: Upload CLI archive to GitHub Release
        if: inputs.attach_to_tag != ''
        shell: bash
        # Fails if the tag/release does not exist — never creates either.
        run: |
          gh release upload "${{ inputs.attach_to_tag }}" \
            "dist/${{ matrix.archive_name }}" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # =========================================================================
  # Backend binary (Linux) — needed as the desktop app's bundled backend
  # =========================================================================
  build-backend:
    needs: frontend-dist
    if: inputs.attach_to_tag == ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CachiBot + PyInstaller
        shell: bash
        run: |
          echo "$CHECK_VERSION" > VERSION
          pip install -e ".[full]"
          pip install pyinstaller

      - name: Clean __pycache__
        shell: bash
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Build backend binary
        run: pyinstaller cachibot-server.spec --clean

      - name: Smoke test backend binary
        shell: bash
        timeout-minutes: 2
        run: |
          BINARY="./dist/cachibot-server/cachibot-server"

          PORT=15870
          "$BINARY" --port $PORT --host 127.0.0.1 &
          SERVER_PID=$!

          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$PORT/api/health" > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "ERROR: Server exited prematurely"
              exit 1
            fi
            sleep 1
          done

          HEALTH=$(curl -sf "http://127.0.0.1:$PORT/api/health")
          echo "Health: $HEALTH"

          if echo "$HEALTH" | grep -q '"version":"0.0.0-unknown"'; then
            echo "ERROR: Version is 0.0.0-unknown"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "Smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-linux
          path: dist/cachibot-server/
          retention-days: 1

  # =========================================================================
  # Mini server binary (Linux) — same steps as publish.yml build-server-mini
  # =========================================================================
  build-server-mini:
    needs: frontend-dist
    if: inputs.attach_to_tag == ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CachiBot (server extras) + PyInstaller
        run: |
          echo "$CHECK_VERSION" > VERSION
          pip install -e ".[server]"
          pip install pyinstaller

      - name: Clean __pycache__
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Build mini server binary
        run: pyinstaller cachibot-server-mini.spec --clean

      - name: Smoke test mini server binary
        timeout-minutes: 2
        run: |
          PORT=15870
          ./dist/cachibot-server-mini/cachibot-server-mini --port $PORT --host 127.0.0.1 &
          SERVER_PID=$!

          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:$PORT/api/health" > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "ERROR: Server exited prematurely"
              exit 1
            fi
            sleep 1
          done

          HEALTH=$(curl -sf "http://127.0.0.1:$PORT/api/health")
          echo "Health: $HEALTH"

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "Mini server smoke test passed"

  # =========================================================================
  # Desktop app (Linux only) — same steps as publish.yml build-desktop,
  # with --publish never so nothing is uploaded anywhere
  # =========================================================================
  build-desktop:
    needs: build-backend
    if: inputs.attach_to_tag == ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Set desktop app version
        working-directory: desktop
        run: npm version "$CHECK_VERSION" --no-git-tag-version

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Download backend binary
        uses: actions/download-artifact@v4
        with:
          name: backend-linux
          path: build/backend

      - name: Make backend executable
        run: chmod +x build/backend/cachibot-server

      - name: Install RPM and system FPM
        run: |
          sudo apt-get update
          # electron-builder 25 bundles fpm 1.9.3, whose spec output is
          # incompatible with rpmbuild >= 4.20 (hundreds of "File not found:
          # .../BUILDROOT/..." errors). Install a current system fpm via gem
          # and select it with USE_SYSTEM_FPM below.
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm
          fpm --version

      - name: Enable electron-builder debug logging
        run: echo "DEBUG=electron-builder" >> "$GITHUB_ENV"

      - name: Build Electron app
        working-directory: desktop
        run: npx electron-builder --linux --publish never
        env:
          USE_SYSTEM_FPM: 'true'

  # =========================================================================
  # Attach mode only: refresh asset sizes in the target release body.
  # Same script as publish.yml's update-release, with the release looked up
  # by tag instead of by the id of a release this workflow created.
  # =========================================================================
  update-release:
    needs: build-cli
    # Run even if a build leg failed, so sizes are still refreshed for
    # whatever archives were uploaded.
    if: always() && inputs.attach_to_tag != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Update release body with asset sizes
        uses: actions/github-script@v6
        with:
          script: |
            // Fetch release to get assets and current body
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ inputs.attach_to_tag }}',
            });
            const releaseId = release.data.id;

            // Build a map of asset name -> human-readable size
            const sizeMap = {};
            for (const asset of release.data.assets) {
              const bytes = asset.size;
              let size;
              if (bytes >= 1024 * 1024 * 1024) {
                size = (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
              } else if (bytes >= 1024 * 1024) {
                size = (bytes / (1024 * 1024)).toFixed(1) + ' MB';
              } else if (bytes >= 1024) {
                size = (bytes / 1024).toFixed(1) + ' KB';
              } else {
                size = bytes + ' B';
              }
              sizeMap[asset.name] = size;
            }

            // Replace "— |" placeholders in the table with actual sizes
            let body = release.data.body;
            for (const [name, size] of Object.entries(sizeMap)) {
              // Match the table row containing this filename and replace the trailing "— |"
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const pattern = new RegExp(`(\\[` + '`' + escaped + '`' + `\\][^|]+\\|)\\s*—\\s*\\|`);
              body = body.replace(pattern, `$1 ${size} |`);
            }

            // Remove the "downloads become available" note since they're ready now
            body = body.replace(/\n> Downloads become available[^\n]*\n?/, '\n');

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              body: body,
            });
